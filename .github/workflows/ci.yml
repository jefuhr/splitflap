name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --test

      # docs/index.html is generated and is what GitHub Pages serves, so a
      # stale copy would quietly publish an old board. Rebuild and compare.
      - run: node scripts/bundle.js
      - run: git diff --exit-code docs/index.html
